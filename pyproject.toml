[project]
name = "llm4tft"
version = "0.2.0"
description = "A single-player autobattler workbench for LLM research and decision data"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "aiohttp>=3.12.14",
    "numpy>=2.0.2",
    "openai>=1.95.1",
    "pyqt6>=6.9.1",
    "python-socketio>=5.13.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=8.4.2",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
check_untyped_defs = true
